[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"
    [".tmux/plugins/tpm".pull]
        args = ["--ff-only"]

[".local/share/zinit/zinit"]
    type = "git-repo"
    url = "https://github.com/zdharma-continuum/zinit.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

[".local/bin/tmux-file-picker"]
    type = "file"
    url = "https://raw.githubusercontent.com/raine/tmux-file-picker/main/tmux-file-picker"
    executable = true
    refreshPeriod = "168h"

[".local/bin/greenclip"]
    type = "file"
    url = "https://github.com/erebe/greenclip/releases/download/v4.2/greenclip"
    executable = true
