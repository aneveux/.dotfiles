[module/claude]
type = custom/script
exec = ~/.config/polybar/scripts/claude-status.sh status
interval = 1

format = <label>
format-suffix = |
format-suffix-foreground = ${colors.subtext0}
label-foreground = ${colors.text}
label-padding = 1
label = %output%

click-left = ~/.config/polybar/scripts/claude-status.sh focus
