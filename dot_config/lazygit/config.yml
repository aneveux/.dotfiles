gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
    authorColors:
      '*': '#b4befe'

git:
  # --features replaces the gitconfig delta.features list, which drops side-by-side
  # in lazygit's narrow panes; cycle renderers with `|`.
  diffRenderers:
    - name: delta
      command: delta --{{colorScheme}} --paging=never --features=catppuccin-mocha --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - name: delta-sbs
      command: delta --{{colorScheme}} --paging=never --features="catppuccin-mocha side-by-side" --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - name: difft
      type: extDiff
      command: difft --color=always --background={{colorScheme}} --context={{diffContext}}
