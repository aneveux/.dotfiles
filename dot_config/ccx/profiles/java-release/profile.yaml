metadata:
  name: java-release
  description: GraalVM native image, DevOps, and release tooling (extends java-quarkus)

extends:
  - java-quarkus

plugins:
  enable:
    - java-graalvm@claude-java-stack
    - java-tooling@claude-java-stack
    - java-devops@claude-java-stack

permissions:
  allow:
    - "Bash(native-image *)"
    - "Bash(gh pr view *)"
    - "Bash(gh pr list *)"
    - "Bash(gh pr checks *)"
    - "Bash(gh pr diff *)"
    - "Bash(gh pr status *)"
    - "Bash(gh pr create *)"
    - "Bash(gh issue view *)"
    - "Bash(gh issue list *)"
    - "Bash(gh run view *)"
    - "Bash(gh run list *)"
    - "Bash(gh repo view *)"
    - "Bash(gh release view *)"
    - "Bash(gh release list *)"
