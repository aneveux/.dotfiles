# Picom configuration for i3 (picom >= 12, window rules)

backend = "glx";
vsync = true;

# Shadows are off globally; the tooltip rule turns them back on with these settings
shadow = false;
shadow-radius = 12;
shadow-offset-x = 3;
shadow-offset-y = 3;
shadow-color = "#11111b";

fading = false;
frame-opacity = 1.0;
corner-radius = 0;

rules = (
    { match = "window_type = 'tooltip'"; shadow = true; full-shadow = false; },
    { match = "window_type = 'dock' || window_type = 'toolbar'"; clip-shadow-above = true; },
    { match = "class_g = 'Dunst' || class_g = 'i3bar' || class_g = 'tray' || _GTK_FRAME_EXTENTS@"; shadow = false; },
);
